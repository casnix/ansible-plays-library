---
- name: Tunnels on core devices.
  vars:
    ansible_ios_commit_confirm_immediate: True
    ansible_ios_commit_confirm_timeout: 3
  connection: ansible.netcommon.network_cli
  hosts: core
  gather_facts: no

  tasks:
    - name: Build tunnel endpoints for l3switches.
      cisco.ios.ios_config:
        lines:
          - "description MCAST {{ hostvars[item]['BASE_NUM'] }} TUN"
          - "ip address 192.168.{{ hostvars[item]['BASE_NUM'] }}.{{ hostvars[item]['TUN_ORIG'] }} 255.255.255.254"
          - ip mtu 1400
          - ip pim sparse-mode
          - keepalive 1 3
          - tunnel source 10.23.90.1
          - "tunnel destination {{ hostvars[item]['TARGET_IP'] }}"
          - "tunnel key 239{{ hostvars[item]['SWITCH_NUM'] }}{{ hostvars[item]['PADDED_BASE_NUM'] }}"
          - tunnel path-mtu-discovery
        parents: "interface Tunnel239{{ hostvars[item]['SWITCH_NUM'] }}{{ hostvars[item]['PADDED_BASE_NUM'] }}"
      loop: "{{ groups['l3switches'] }}"

    - name: Build tunnel endpoints for routers.
      cisco.ios.ios_config:
        lines:
          - "description MCAST {{ hostvars[item]['BASE_NUM'] }} TUN"
          - "ip address 192.168.{{ hostvars[item]['BASE_NUM'] }}.{{ hostvars[item]['TUN_ORIG'] }} 255.255.255.254"
          - ip mtu 1400
          - ip pim sparse-mode
          - keepalive 1 3
          - tunnel source 10.23.90.1
          - "tunnel destination {{ hostvars[item]['TARGET_IP'] }}"
          - "tunnel key 239{{ hostvars[item]['SWITCH_NUM'] }}{{ hostvars[item]['PADDED_BASE_NUM'] }}"
          - tunnel path-mtu-discovery
        parents: "interface Tunnel239{{ hostvars[item]['SWITCH_NUM'] }}{{ hostvars[item]['PADDED_BASE_NUM'] }}"
      loop: "{{ groups['routers'] }}"

    - name: Save config.
      cisco.ios.ios_config:
        save_when: modified